config:
  # Buildenv backend name
  backendName:
    __resolver__: nmk_base.backends.BackendNameResolver

  # Buildenv backend lockfile
  backendLockfile:
    __resolver__: nmk_base.resolvers.MultiStrChoiceResolver
    params:
      key: ${backendName}
      choices:
        uv: ${PROJECTDIR}/uv.lock
      default: ""

  # By default: ignore buildenv backend lockfile in source control
  backendIgnoreLockfile: true

  # Ignored lockfile
  backendCleanedLockfile:
    __resolver__: nmk_base.resolvers.MultiStrChoiceResolver
    params:
      key: ${backendIgnoreLockfile}
      choices:
        true: ${backendLockfile}
      default: ""

  gitIgnoredFiles:
    - ${backendCleanedLockfile} # Ignore buildenv backend lockfile (if clean enabled)

tasks:
  # Clean lock file
  clean.lockfile:
    description: Clean buildenv backend lockfile
    emoji: ":broom:.:locked:"
    builder: nmk_base.common.CleanBuilder
    params:
      path: ${backendCleanedLockfile}
    appendToDeps:
      - clean
    if: ${backendCleanedLockfile}
