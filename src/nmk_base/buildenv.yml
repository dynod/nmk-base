config:
  # Buildenv backend name
  backendName:
    __resolver__: nmk_base.backends.BackendNameResolver

  # Buildenv backend lockfile
  backendLockfile:
    __resolver__: nmk_base.resolvers.MultiStrChoiceResolver
    params:
      key: ${backendName}
      choices:
        uv: ${PROJECTDIR}/uv.lock
      default: ""

  # By default: ignore lockfiles in source control
  ignoreLockfiles: true

  # Contributed lockfiles by other plugins
  extraLockfiles: []

  # Ignored lockfiles
  cleanedLockfiles:
    __resolver__: nmk_base.resolvers.MultiListChoiceResolver
    params:
      key: ${ignoreLockfiles}
      choices:
        true:
          - ${backendLockfile}
          - ${extraLockfiles}
      default: []

  gitIgnoredFiles:
    - ${cleanedLockfiles} # Ignore lockfiles (if clean enabled)

tasks:
  # Clean lock file
  clean.lockfiles:
    description: Clean lockfiles
    emoji: ":broom:.:locked:"
    builder: nmk_base.common.CleanBuilder
    params:
      path: ${cleanedLockfiles}
    appendToDeps:
      - clean
    if: ${cleanedLockfiles}
